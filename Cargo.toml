[package]
name = "dispatcher"
version = "0.1.0"
edition = "2021"

[lib]
name = "dispatch"
path = "src/lib.rs"

[[bin]]
name = "dispatch_daemon"
path = "src/bin/main.rs"

[dependencies]
actix = "0.13.5"
actix-rt = "2.10.0"
tokio = { version = "1.42.0", features = ["process"]}
tokio-util = "0.7.13"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
log-panics = "2.1.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
anyhow = "1.0.95"
notify = "7.0.0"
device_query = "2.1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = ["Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
